<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>泛函风格物料</title>
  <link rel="stylesheet" href="fanhan-theme.css">
</head>
<body>
  <!-- 按交付物切换为 fh-web、fh-slide、fh-card-3x4 或 fh-poster。 -->
  <main class="fh-canvas fh-card-3x4 fh-stack">
    <header class="fh-brand"><span class="fh-mark">函</span><span>泛函</span></header>

    <section class="fh-stack">
      <p class="fh-eyebrow">Fanhan · AI Native Network</p>
      <h1 class="fh-title">把真正重要的信息，讲得清楚也好看。</h1>
      <p class="fh-lede">用一句简洁说明交代对象、价值与行动，不要用装饰填满空间。</p>
    </section>

    <section class="fh-grid">
      <article class="fh-card fh-card--accent">
        <div class="fh-stack">
          <span class="fh-chip">重点</span>
          <h2>一个明确结论</h2>
          <p>绿色只承接最重要的信息，让读者一眼知道应该记住什么。</p>
        </div>
        <a class="fh-button fh-button--secondary" href="#action">行动入口</a>
      </article>
      <article class="fh-card">
        <div class="fh-stack">
          <span class="fh-chip">证据 01</span>
          <h3>真实内容优先</h3>
          <p>用事实、案例或方法支撑主结论，不编造数字和背书。</p>
        </div>
      </article>
      <article class="fh-card fh-card--dark">
        <div class="fh-stack">
          <span class="fh-chip">流程 02</span>
          <h3>机制放深色区</h3>
          <p>深色模块用于流程与系统，不把整张物料变成模板化科技风。</p>
        </div>
      </article>
    </section>

    <footer id="action" class="fh-stack">
      <hr class="fh-rule">
      <div class="fh-chips"><span class="fh-chip">温暖</span><span class="fh-chip">可信</span><span class="fh-chip">编辑感</span></div>
    </footer>
  </main>
</body>
</html>
